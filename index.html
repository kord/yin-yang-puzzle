  <title>Yin Yang Puzzle</title>

  <!--
    Resolve the theme before first paint so there is no flash. `data-theme` is
    the only thing src/index.css keys off; everything else is tokens.
    The storage key must match STORAGE_KEY in src/theme.ts.
  -->
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem('yinyang.theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
      } catch (e) {
        theme = 'dark';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
